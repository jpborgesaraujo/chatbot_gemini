<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoMart</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
</head>
<body>
    <header class="cabecalho">
        <img src="{{ url_for('static', filename='img/logo-chatbot.svg') }}" alt="EcoMart">
    </header>
    <main class="main">
        <section class="chat" id="chat" aria-live="polite">
            <p class="chat__bolha chat__bolha--bot">
                Olá! Eu sou o assistente virtual da EcoMart.<br><br>
                Como posso te ajudar?
            </p>
        </section>
        <section class="entrada">
            <div class="entrada__container">
                <button type="button" id="mais_arquivo" aria-label="Opções (em breve)" disabled>+</button>
                <input type="text" class="entrada__input" placeholder="Enviar uma mensagem" id="input">
                <button type="button" aria-label="Enviar mensagem" id="botao-enviar">
                    <img src="{{ url_for('static', filename='img/enviar.svg') }}" alt="">
                </button>
            </div>
        </section>
    </main>
    <script src="{{ url_for('static', filename='js/index.js') }}" defer></script>
</body>
</html>
